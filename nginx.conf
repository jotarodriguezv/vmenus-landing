server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── LA CODIFICACIÓN, DICHA DOS VECES ─────────────────────────
  # Esto añade '; charset=utf-8' al Content-Type. Sin ello nginx servía
  # 'text/html' a secas, el navegador se caía a su codificación por defecto y
  # leía los bytes UTF-8 como Latin-1: 'teléfono' salía 'telÃ©fono'.
  #
  # El index.html también lo declara con <meta charset>, y no sobra ninguno de
  # los dos. La cabecera MANDA sobre la etiqueta, así que sin esta línea un
  # archivo mal servido no lo arregla su propio HTML; y la etiqueta cubre el
  # caso de abrir el archivo desde el disco, sin servidor de por medio.
  charset utf-8;

  # ── DOS POLÍTICAS DE CACHÉ, Y NO ES UN CAPRICHO ──────────────
  # La regla que las decide: ¿un nombre nuevo significa un archivo nuevo?
  #
  # 'index.html' se llama igual antes y después de cada despliegue, así que
  # una caché por tiempo dejaría a la gente leyendo la página de antes hasta
  # que caducara. Va con 'no-cache', que NO significa "no guardes" sino
  # "guarda, pero pregunta antes de usarlo": el navegador manda el ETag y
  # nginx responde 304 sin cuerpo si no cambió. Se ahorra la descarga igual y
  # nunca se sirve una versión vieja.
  #
  # Las imágenes son al revés, y a propósito: se les pone versión en el
  # nombre ('carta-movil-v2.webp'), así que un nombre nuevo ES un archivo
  # nuevo y se pueden cachear un año sin miedo. Cambiar una imagen es subirla
  # con otro nombre y cambiar el <img>.
  #
  # Esto es la lección de vmenus-app aplicada bien desde el principio: allí
  # todo va con 'no-cache' porque ningún archivo lleva versión, y su
  # nginx.conf lo deja escrito — "el día que los archivos lleven un hash en el
  # nombre esto puede volver a ser expires 1y".
  #
  # Ojo con add_header: en nginx, ponerlo dentro de un location ANULA los del
  # bloque padre. Por eso se repiten en cada uno en vez de declararlos arriba.

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }

  # Este bloque gana sobre 'location /' para lo que haya en imagenes/.
  location /imagenes/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }

  # Sin esto, una ruta que no existe devuelve la página de nginx.
  error_page 404 /index.html;
}
